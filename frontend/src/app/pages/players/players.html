<div class="players-page">

  <!-- HEADER -->
  <div class="page-header">
    <div>
      <h2>
        <i class="bi bi-people"></i>
        Jugadores
      </h2>
      <p>Gestión de jugadores</p>
    </div>

    <button class="btn-create" routerLink="/player/{{-1}}">
      <i class="bi bi-person-plus"></i>
      Crear jugador
    </button>
  </div>

  <!-- LOADING -->
  @if (!jugadores.length) {
    <div class="loading">
      <i class="bi bi-arrow-repeat spin"></i>
      Cargando jugadores...
    </div>
  }

  <!-- GRID -->
  <div class="players-grid">

    @for (player of jugadores; track player.id) {
      <div class="player-card">

        <!-- FOTO -->
        <img
          class="player-img"
          [src]="player.fotoUrl || 'https://via.placeholder.com/80'"
          alt="player"
        />

        <!-- INFO -->
        <div class="player-info">
          <h3>
            <i class="bi bi-person"></i>
            {{ player.nombre }}
          </h3>

          <p>
            <i class="bi bi-diagram-3"></i>
            {{ player.posicion }}
          </p>

          <span class="team">
            <i class="bi bi-shield"></i>
            {{ player.equipo?.nombre }}
          </span>
        </div>

        <!-- ACTIONS -->
        <div class="player-actions">

          <button class="btn-edit" routerLink="/player/{{player.id}}">
            <i class="bi bi-pencil-square"></i>
          </button>

          <button class="btn-delete" (click)="deletePlayer(player.id)">
            <i class="bi bi-trash"></i>
          </button>

        </div>

      </div>
    }

  </div>

</div>

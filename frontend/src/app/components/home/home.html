<div class="main-wrapper">

  </header>

  <!-- LIGAS -->
  <section class="leagues-grid">

    <!-- LALIGA -->
    <div class="league-card laliga" routerLink="/laliga">
      
      <div class="league-header">
        <img 
          src="https://assets.laliga.com/assets/logos/LL_RGB_h_color/LL_RGB_h_color.png" 
          alt="LaLiga logo"

    <!-- PREMIER -->
    <div class="league-card premier" routerLink="/premierLeague">

      <div class="league-header">
        <img 
          src="https://logodownload.org/wp-content/uploads/2016/03/premier-league-5.png" 
          alt="Premier League logo"
        />

      </div>

      <button>Entrar →</button>

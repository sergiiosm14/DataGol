<div class="page-wrapper py-4">

  <!-- HEADER -->
  <div class="d-flex justify-content-between align-items-center mb-4">

    <h2 class="mb-0">
      {{ form.value.id ? 'Editar equipo' : 'Nuevo equipo' }}
    </h2>

    <button class="btn btn-outline-secondary" (click)="back()">
      ⬅ Back
    </button>

  </div>

  <!-- FORM -->
  <form [formGroup]="form" (ngSubmit)="save()">

    <div class="card shadow border-0">
      <div class="card-body">

        <div class="row">

          <!-- Nombre -->
          <div class="col-md-6 mb-3">
            <label class="form-label">Nombre</label>
            <input
              class="form-control"
              formControlName="nombre"
              placeholder="Ej: Real Madrid"
            />
          </div>

          <!-- País -->
          <div class="col-md-6 mb-3">
            <label class="form-label">País</label>
            <input
              class="form-control"
              formControlName="pais"
              placeholder="Ej: España"
            />
          </div>

          <!-- Liga -->
          <div class="col-md-6 mb-3">
            <label class="form-label">Liga</label>
            <input
              class="form-control"
              formControlName="liga"
              placeholder="Ej: LaLiga"
            />
          </div>

          <!-- Estadio -->
          <div class="col-md-6 mb-3">
            <label class="form-label">Estadio</label>
            <input
              class="form-control"
              formControlName="estadio"
              placeholder="Ej: Santiago Bernabéu"
            />
          </div>

          <!-- Fundación -->
          <div class="col-md-6 mb-3">
            <label class="form-label">Año de fundación</label>
            <input
              type="number"
              class="form-control"
              formControlName="fundacion"
              placeholder="Ej: 1902"
            />
          </div>

          <!-- Escudo -->
          <div class="col-12 mb-3">
            <label class="form-label">Escudo (URL)</label>
            <input
              class="form-control"
              formControlName="escudoUrl"
              placeholder="https://..."
            />
          </div>

        </div>

        <!-- ERROR -->
        @if (errorFormulario) {
          <div class="alert alert-danger">
            {{ errorFormulario }}
          </div>
        }

        <!-- BOTONES -->
        <div class="d-flex gap-2">

          <button type="submit" class="btn btn-success">
            Guardar
          </button>

          <button type="button" class="btn btn-secondary" (click)="back()">
            Cancelar
          </button>

        </div>

      </div>
    </div>

  </form>

</div>

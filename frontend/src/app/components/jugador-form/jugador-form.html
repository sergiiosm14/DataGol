<div class="editor-wrapper">

  <div class="editor-header">
    <h2>
      <span class="status-dot" [style.background]="form.value.id == -1 ? '#27ae60' : '#2980b9'"></span>
      {{ form.value.id == -1 ? 'Registrar Jugador' : 'Editar Ficha' }}
    </h2>
    <button class="btn-minimal" (click)="back()">⬅ Volver</button>
  </div>

  <form [formGroup]="form" (ngSubmit)="save()" class="form-container">
    
    <div class="form-card">
      <div class="form-section-title">Datos Personales</div>
      <div class="grid-row">
        <div class="field">
          <label>Nombre</label>
          <input formControlName="nombre" placeholder="Ej. Pedri">
        </div>
        <div class="field">
          <label>Primer Apellido</label>
          <input formControlName="apellido1" placeholder="Ej. González">
        </div>
        <div class="field">
          <label>Segundo Apellido</label>
          <input formControlName="apellido2" placeholder="Opcional">
        </div>
        <div class="field">
          <label>Nacionalidad</label>
          <input formControlName="nacionalidad" placeholder="Ej. España">
        </div>
      </div>

      <div class="form-section-title">Perfil Deportivo</div>
      <div class="grid-row">
        <div class="field">
          <label>Posición</label>
          <select formControlName="posicion">
            <option value="">Seleccionar...</option>
            @for (pos of posiciones; track pos.value) {
              <option [value]="pos.value">{{ pos.viewValue }}</option>
            }
          </select>
        </div>
        <div class="field">
          <label>Equipo Actual</label>
          <select formControlName="equipo">
            <option value="">Agente Libre</option>
            @for (eq of equipos; track eq.id) {
              <option [value]="eq.id">{{ eq.nombre }}</option>
            }
          </select>
        </div>
        <div class="field">
          <label>Edad</label>
          <input type="number" formControlName="edad">
        </div>
        <div class="field">
          <label>Valor (M€)</label>
          <input type="number" formControlName="valorMercado">
        </div>
      </div>

      <div class="form-section-title">Físico y Estadísticas</div>
      <div class="grid-row">
        <div class="field">
          <label>Estatura (m)</label>
          <input type="number" step="0.01" formControlName="estatura">
        </div>
        <div class="field">
          <label>Peso (kg)</label>
          <input type="number" formControlName="peso">
        </div>
        <div class="field">
          <label>Goles</label>
          <input type="number" formControlName="goles" class="stat-input">
        </div>
        <div class="field">
          <label>Asistencias</label>
          <input type="number" formControlName="asistencias" class="stat-input">
        </div>
      </div>

      <div class="field full-width">
        <label>URL de la Fotografía</label>
        <input formControlName="fotoUrl" placeholder="https://...">
      </div>

      @if (errorFormulario) {
        <div class="form-error">
          ⚠️ {{ errorFormulario }}
        </div>
      }

      <div class="form-actions">
        <button type="submit" class="btn-save">Guardar Cambios</button>
        <button type="button" class="btn-cancel" (click)="back()">Cancelar</button>
      </div>

    </div>
  </form>
</div>

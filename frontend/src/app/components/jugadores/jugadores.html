<div class="list-container">
  
  <div class="list-header">
    <button class="btn-back" (click)="back()">← Volver al inicio</button>
    <h2>Listado de Jugadores</h2>
    <button class="btn-add" (click)="crearJugador()">+ Nuevo Jugador</button>
  </div>

  <div class="table-wrapper">
    <table class="data-table">
      <thead>
        <tr>
          <th>Jugador</th>
          <th>Posición</th>
          <th class="text-center">Edad</th>
          <th>Club</th>
          <th class="text-center">Acciones</th>
        </tr>
      </thead>

      <tbody>
        @for (jugador of jugadores; track jugador.id) {
          <tr>
            <td class="player-name">
              <strong>{{ jugador.nombre }}</strong> {{ jugador.apellido1 }}
            </td>

            <td><span class="pos-badge">{{ jugador.posicion }}</span></td>

            <td class="text-center">{{ jugador.edad }}</td>

            <td>
              @if (jugador.equipo) {
                <span class="team-name">{{ jugador.equipo.nombre }}</span>
              } @else {
                <span class="free-agent">Agente Libre</span>
              }
            </td>

            <td class="actions-cell">
              <button class="btn-icon view" [routerLink]="['/jugador', jugador.id]" title="Ver detalles">👁️</button>
              <button class="btn-icon edit" [routerLink]="['/jugador/add', jugador.id]" title="Editar">✏️</button>
              <button class="btn-icon delete" (click)="borrarJugador(jugador.id)" title="Borrar">🗑️</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  
</div>
